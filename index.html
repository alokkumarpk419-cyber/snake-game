<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Snake World</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,#183d31,transparent 35%),
    radial-gradient(circle at 90% 90%,#192b48,transparent 35%),
    #071018;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

.app{
  width:100%;
  max-width:560px;
  margin:auto;
  padding:10px;
}

/* ================= HEADER ================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  margin-bottom:7px;
}

.title{
  font-size:25px;
  font-weight:900;
  color:#ffd52b;
  text-shadow:2px 2px #553800;
}

.topButton{
  width:43px;
  height:38px;
  border-radius:12px;
  border:1px solid #55718d;
  background:#142238;
  color:white;
  font-size:18px;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-bottom:7px;
}

.stat{
  background:#111c2b;
  border:1px solid #39516c;
  border-radius:9px;
  padding:6px 3px;
  text-align:center;
  font-size:10px;
}

.stat b{
  display:block;
  color:#ffd52b;
  font-size:14px;
  margin-top:2px;
}

/* ================= SMALL MENU BOXES ================= */

.menu{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:8px;
}

.menu button{
  min-height:42px;
  border:1px solid #42647f;
  background:#122236;
  color:#fff;
  border-radius:10px;
  font-weight:bold;
  font-size:11px;
  cursor:pointer;
}

.menu button:active{
  transform:scale(.95);
}

.menu .pause{
  color:#ffd52b;
}

/* ================= GAME ================= */

.gameWrap{
  width:100%;
  position:relative;
}

.game{
  width:100%;
  aspect-ratio:1/1;
  background:#158b31;
  border:4px solid #68ff78;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  box-shadow:0 0 0 2px #0d5720;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

.pauseOverlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}

.pauseOverlay.show{
  display:flex;
}

.pauseText{
  background:#111827;
  border:2px solid #ffd52b;
  padding:15px 25px;
  border-radius:15px;
  font-size:23px;
  font-weight:bold;
}

/* ================= CONTROLS ================= */

.controls{
  width:190px;
  margin:12px auto 0;
  display:grid;
  grid-template-columns:55px 55px 55px;
  grid-template-rows:55px 55px 55px;
  gap:7px;
  justify-content:center;
}

.control{
  width:55px;
  height:55px;
  border-radius:50%;
  border:2px solid #6aff78;
  background:#193d2a;
  color:#fff;
  font-size:25px;
  font-weight:bold;
  box-shadow:0 2px 0 #092016;
}

.control:active{
  transform:scale(.91);
}

/* ऊपर */
.up{
  grid-column:2;
  grid-row:1;
}

/* left / right */
.left{
  grid-column:1;
  grid-row:2;
}

.right{
  grid-column:3;
  grid-row:2;
}

/* नीचे वाला button सबसे नीचे */
.down{
  grid-column:2;
  grid-row:3;
}

/* ================= FOOTER ================= */

.footer{
  text-align:center;
  margin-top:8px;
  color:#9fb2c7;
  font-size:10px;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.modal.show{
  display:flex;
}

.modalCard{
  width:min(94vw,430px);
  max-height:82vh;
  overflow:auto;
  background:#101b2b;
  border:2px solid #4b7597;
  border-radius:18px;
  padding:16px;
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.modalHeader h2{
  color:#ffd52b;
  font-size:21px;
}

.close{
  width:35px;
  height:35px;
  border:0;
  border-radius:10px;
  background:#26374d;
  color:white;
  font-size:20px;
}

/* ================= CHOICES ================= */

.choiceGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.choice{
  min-height:76px;
  border:2px solid #405872;
  border-radius:13px;
  background:#17273b;
  color:white;
  cursor:pointer;
  font-size:31px;
}

.choice small{
  display:block;
  font-size:10px;
  margin-top:4px;
  color:#c7d4e2;
}

.choice.selected{
  border-color:#69ff75;
  box-shadow:0 0 0 2px rgba(105,255,117,.15);
}

/* colors */

.colorDot{
  width:35px;
  height:35px;
  display:block;
  border-radius:50%;
  margin:auto;
  border:2px solid white;
}

/* ================= GAME OVER ================= */

.gameOver{
  text-align:center;
}

.gameOver h2{
  color:#ff6464;
  margin-bottom:12px;
}

.playAgain{
  margin-top:15px;
  padding:11px 22px;
  border:0;
  border-radius:11px;
  background:#ffd52b;
  color:#111;
  font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:380px){

  .title{
    font-size:21px;
  }

  .stats{
    gap:3px;
  }

  .stat{
    font-size:9px;
  }

  .stat b{
    font-size:12px;
  }

  .menu button{
    font-size:10px;
  }

  .controls{
    transform:scale(.92);
    transform-origin:top center;
  }

}
</style>
</head>

<script>

/* =====================================================
   BASIC SETTINGS
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const GRID = 20;

/*
   बड़ा number = धीमी speed.
   240 = slow & comfortable.
*/

const SPEED = 240;

let tile = 20;

let snake = [];

let fruit = {
  x:10,
  y:10
};

let direction = {
  x:1,
  y:0
};

let nextDirection = {
  x:1,
  y:0
};

let score = 0;
let fruitCount = 0;

let running = true;
let paused = false;

let lastTime = 0;


/* =====================================================
   PERMANENT SAVED DATA
===================================================== */

let coins =
Number(
  localStorage.getItem(
    "snakeCoins"
  ) || 0
);

let best =
Number(
  localStorage.getItem(
    "snakeBest"
  ) || 0
);

let snakeColor =
localStorage.getItem(
  "snakeColor"
) || "#ffd21c";

let snakeFace =
localStorage.getItem(
  "snakeFace"
) || "😈";

let selectedFruit =
localStorage.getItem(
  "snakeFruit"
) || "🍎";


/* =====================================================
   SOUND
===================================================== */

let soundOn = true;

let audio = null;

function initAudio(){

  if(audio) return;

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(AudioContext){
    audio = new AudioContext();
  }

}

function beep(
  frequency,
  duration,
  volume=.14
){

  if(!soundOn) return;

  initAudio();

  if(!audio) return;

  const osc =
    audio.createOscillator();

  const gain =
    audio.createGain();

  osc.frequency.value =
    frequency;

  osc.type =
    "triangle";

  gain.gain.setValueAtTime(
    .001,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    audio.currentTime+.02
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  osc.stop(
    audio.currentTime+
    duration+
    .03
  );

}


/* Fruit = Twing Twing */

function fruitSound(){

  beep(850,.12,.18);

  setTimeout(
    () => beep(1250,.16,.18),
    100
  );

}


/* Wall = Thak */

function crashSound(){

  beep(120,.18,.2);

  setTimeout(
    () => beep(70,.25,.16),
    120
  );

}


/* Gift */

function giftSound(){

  beep(500,.12,.15);

  setTimeout(
    () => beep(750,.12,.15),
    100
  );

  setTimeout(
    () => beep(1000,.18,.15),
    200
  );

}


/* =====================================================
   SAVE COINS
===================================================== */

function saveCoins(){

  localStorage.setItem(
    "snakeCoins",
    String(coins)
  );

}

function addCoins(amount){

  coins += amount;

  saveCoins();

  updateUI();

}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  const rect =
    canvas.getBoundingClientRect();

  canvas.width =
    rect.width;

  canvas.height =
    rect.height;

  tile =
    canvas.width / GRID;

  draw();

}

window.addEventListener(
  "resize",
  resize
);


/* =====================================================
   NEW GAME
===================================================== */

function newGame(){

  snake = [

    {x:10,y:10},
    {x:9,y:10},
    {x:8,y:10},
    {x:7,y:10}

  ];

  direction = {
    x:1,
    y:0
  };

  nextDirection = {
    x:1,
    y:0
  };

  score = 0;
  fruitCount = 0;

  running = true;
  paused = false;

  document
  .getElementById(
    "pauseOverlay"
  )
  .classList
  .remove("show");

  document
  .getElementById(
    "pauseBtn"
  )
  .textContent =
  "⏸️";

  createFruit();

  closeModal(
    "gameOverModal"
  );

  updateUI();

}


/* =====================================================
   FRUIT
===================================================== */

function createFruit(){

  let okay = false;

  while(!okay){

    fruit = {

      x:
      Math.floor(
        Math.random()*GRID
      ),

      y:
      Math.floor(
        Math.random()*GRID
      )

    };

    okay =
      !snake.some(
        part =>
          part.x === fruit.x &&
          part.y === fruit.y
      );

  }

}


/* =====================================================
   DIRECTION
===================================================== */

function setDirection(x,y){

  if(!running || paused)
    return;

  if(
    x === -direction.x &&
    y === -direction.y
  ){
    return;
  }

  nextDirection = {
    x:x,
    y:y
  };

}


/* Keyboard */

document.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "ArrowUp"
    ){
      e.preventDefault();
      setDirection(0,-1);
    }

    if(
      e.key === "ArrowDown"
    ){
      e.preventDefault();
      setDirection(0,1);
    }

    if(
      e.key === "ArrowLeft"
    ){
      e.preventDefault();
      setDirection(-1,0);
    }

    if(
      e.key === "ArrowRight"
    ){
      e.preventDefault();
      setDirection(1,0);
    }

    if(
      e.code === "Space"
    ){
      e.preventDefault();
      togglePause();
    }

  }
);


/* Mobile buttons */

document
.querySelectorAll(".control")
.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        initAudio();

        const d =
          button.dataset.dir;

        if(d === "up")
          setDirection(0,-1);

        if(d === "down")
          setDirection(0,1);

        if(d === "left")
          setDirection(-1,0);

        if(d === "right")
          setDirection(1,0);

      }
    );

  }
);


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

  if(!running)
    return;

  paused =
    !paused;

  document
  .getElementById(
    "pauseOverlay"
  )
  .classList.toggle(
    "show",
    paused
  );

  document
  .getElementById(
    "pauseBtn"
  )
  .textContent =
  paused ? "▶️" : "⏸️";

}

document
.getElementById("pauseBtn")
.onclick = () => {

  initAudio();

  togglePause();

};


/* =====================================================
   UPDATE
===================================================== */

function update(){

  if(!running || paused)
    return;

  direction =
    nextDirection;

  const head = {

    x:
      snake[0].x +
      direction.x,

    y:
      snake[0].y +
      direction.y

  };


  /* WALL COLLISION */

  if(
    head.x < 0 ||
    head.x >= GRID ||
    head.y < 0 ||
    head.y >= GRID
  ){

    gameOver();

    return;

  }


  /* BODY COLLISION */

  if(
    snake.some(
      part =>
        part.x === head.x &&
        part.y === head.y
    )
  ){

    gameOver();

    return;

  }


  snake.unshift(head);


  /* FRUIT */

  if(
    head.x === fruit.x &&
    head.y === fruit.y
  ){

    score += 10;

    fruitCount++;

    /*
      हर fruit को coins में convert किया जाता है.
      एक समय में केवल एक fruit रहता है.
    */

    addCoins(2);

    fruitSound();

    createFruit();


    if(score > best){

      best = score;

      localStorage.setItem(
        "snakeBest",
        String(best)
      );

    }

  }
  else{

    snake.pop();

  }

  updateUI();

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  running = false;

  saveCoins();

  crashSound();

  document
  .getElementById(
    "finalScore"
  )
  .textContent =
  score;

  document
  .getElementById(
    "finalCoins"
  )
  .textContent =
  coins;

  setTimeout(
    () => {

      openModal(
        "gameOverModal"
      );

    },
    150
  );

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* GREEN PLAY AREA */

  ctx.fillStyle =
    "#158b31";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* हल्का grid */

  ctx.strokeStyle =
    "rgba(0,0,0,.08)";

  ctx.lineWidth = 1;

  for(
    let i=0;
    i<=GRID;
    i++
  ){

    ctx.beginPath();

    ctx.moveTo(
      i*tile,
      0
    );

    ctx.lineTo(
      i*tile,
      canvas.height
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      0,
      i*tile
    );

    ctx.lineTo(
      canvas.width,
      i*tile
    );

    ctx.stroke();

  }


  /* Fruit */

  ctx.font =
    `${tile*.72}px Arial`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    selectedFruit,
    fruit.x*tile+tile/2,
    fruit.y*tile+tile/2
  );


  /* Snake */

  snake.forEach(
    (part,index) => {

      ctx.fillStyle =
        snakeColor;

      const x =
        part.x*tile+2;

      const y =
        part.y*tile+2;

      const size =
        tile-4;

      roundRect(
        x,
        y,
        size,
        size,
        6
      );

      if(index === 0){

        drawHead(
          x,
          y,
          size
        );

      }

    }
  );

}


/* =====================================================
   ROUND RECT
===================================================== */

function roundRect(
  x,y,w,h,r
){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.lineTo(
    x+w-r,
    y
  );

  ctx.quadraticCurveTo(
    x+w,
    y,
    x+w,
    y+r
  );

  ctx.lineTo(
    x+w,
    y+h-r
  );

  ctx.quadraticCurveTo(
    x+w,
    y+h,
    x+w-r,
    y+h
  );

  ctx.lineTo(
    x+r,
    y+h
  );

  ctx.quadraticCurveTo(
    x,
    y+h,
    x,
    y+h-r
  );

  ctx.lineTo(
    x,
    y+r
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x+r,
    y
  );

  ctx.closePath();

  ctx.fill();

}


/* =====================================================
   SNAKE HEAD
===================================================== */

function drawHead(
  x,y,size
){

  ctx.save();

  ctx.translate(
    x+size/2,
    y+size/2
  );


  let angle = 0;

  if(direction.x === -1)
    angle = Math.PI;

  if(direction.y === -1)
    angle = -Math.PI/2;

  if(direction.y === 1)
    angle = Math.PI/2;

  ctx.rotate(angle);

  ctx.translate(
    -size/2,
    -size/2
  );


  /*
    Two black eyes
  */

  ctx.fillStyle =
    "#000";

  ctx.beginPath();

  ctx.arc(
    size*.30,
    size*.30,
    size*.09,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    size*.70,
    size*.30,
    size*.09,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    Tongue
  */

  ctx.strokeStyle =
    "#ff3333";

  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    size/2,
    size*.62
  );

  ctx.lineTo(
    size/2,
    size
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    size/2,
    size
  );

  ctx.lineTo(
    size*.39,
    size*.89
  );

  ctx.moveTo(
    size/2,
    size
  );

  ctx.lineTo(
    size*.61,
    size*.89
  );

  ctx.stroke();


  /*
    Selected emoji face
  */

  ctx.font =
    `${size*.45}px Arial`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    snakeFace,
    size/2,
    size*.65
  );


  ctx.restore();

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

  document.getElementById(
    "score"
  ).textContent =
  score;

  document.getElementById(
    "fruitCount"
  ).textContent =
  fruitCount;

  document.getElementById(
    "coins"
  ).textContent =
  coins;

  document.getElementById(
    "best"
  ).textContent =

  document.getElementById(

  ).textContent =

}


/* =====================================================
   MODALS
===================================================== */

function openModal(id){

  document
  .getElementById(id)
  .classList
  .add("show");

}

function closeModal(id){

  document
  .getElementById(id)
  .classList
  .remove("show");

}


document
.querySelectorAll("[data-close]")
.forEach(
  button => {

    button.onclick =
    () => {

      closeModal(
        button.dataset.close
      );

    };

  }
);


/* =====================================================
   MENU BUTTONS
===================================================== */

document
.getElementById("fruitMenu")
.onclick =
() => openModal("fruitModal");

document
.getElementById("colorMenu")
.onclick =
() => openModal("colorModal");

document
.getElementById("faceMenu")
.onclick =
() => openModal("faceModal");

document
.getElementById("giftMenu")
.onclick =
() => openModal("giftModal");


/* =====================================================
   FRUIT SELECT
===================================================== */

document
.querySelectorAll("[data-fruit]")
.forEach(
  button => {

    button.onclick =
    () => {

      selectedFruit =
        button.dataset.fruit;

      localStorage.setItem(
        "snakeFruit",
        selectedFruit
      );

      markSelected(
        "[data-fruit]",
        button
      );

      closeModal(
        "fruitModal"
      );

    };

  }
);


/* =====================================================
   COLOR SELECT
===================================================== */

document
.querySelectorAll("[data-color]")
.forEach(

    button.onclick =
    () => {

      snakeColor =
        button.dataset.color;

      localStorage.setItem(
        "snakeColor",
        snakeColor
      );

      markSelected(
        "[data-color]",
        button
      );

/* =====================================================
   FACE SELECT
===================================================== */

document
.querySelectorAll("[data-face]")
.forEach(
  button => {

    button.onclick =
    () => {

      snakeFace =
        button.dataset.face;

      localStorage.setItem(
        "snakeFace",
        snakeFace
      );

      markSelected(
        "[data-face]",
        button
      );

      closeModal(
        "faceModal"
      );

    };

  }
);


function markSelected(
  selector,
  selected
){

  document
  .querySelectorAll(selector)
  .forEach(
    b =>
      b.classList.remove(
        "selected"
      )
  );

  selected.classList.add(
    "selected"
  );

}


/* =====================================================
   SOUND BUTTON
===================================================== */

document
.getElementById("soundBtn")
.onclick =
() => {

  soundOn =
    !soundOn;

  document
  .getElementById("soundBtn")
  .textContent =
  soundOn ? "🔊" : "🔇";

  if(soundOn){

    initAudio();

    beep(
      700,
      .1,
      .12
    );

  }

};


/* =====================================================
   GIFTS
===================================================== */

document
.querySelectorAll(".buy")
.forEach(
  button => {

    button.onclick =
    () => {

      const cost =
        Number(
          button.dataset.cost
        );

      if(coins < cost){

        alert(
          "🪙 Coins कम हैं!"
        );

        return;

      }

      coins -= cost;

      saveCoins();

      updateUI();

      giftSound();

      alert(
        "🎁 Gift Unlocked!"
      );

    };

  }
);


/* =====================================================
   PLAY AGAIN
===================================================== */

document
.getElementById("againBtn")
.onclick =
() => {

  newGame();

};


/* =====================================================
   RESTORE SELECTIONS
===================================================== */

function restore(){

  document
  .querySelectorAll(
    "[data-fruit]"
  )
  .forEach(
    b => {

      if(
        b.dataset.fruit ===
        selectedFruit
      ){

        b.classList.add(
          "selected"
        );

      }

    }
  );


  document
  .querySelectorAll(
    "[data-color]"
  )
  .forEach(
    b => {

      if(
        b.dataset.color ===
        snakeColor
      ){

        b.classList.add(
          "selected"
        );

      }

    }
  );


  document
  .querySelectorAll(
    "[data-face]"
  )
  .forEach(
    b => {

      if(
        b.dataset.face ===
        snakeFace
      ){

        b.classList.add(
          "selected"
        );

      }

    }
  );

}


/* =====================================================
   START
===================================================== */

resize();

newGame();

restore();

updateUI();


/* =====================================================
   GAME LOOP
===================================================== */

function loop(time){

  if(
    running &&
    !paused &&
    time-lastTime >= SPEED
  ){

    update();

    lastTime = time;

  }

  draw();

  requestAnimationFrame(
    loop
  );

}

requestAnimationFrame(loop);


/* =====================================================
   SAVE WHEN PAGE IS CLOSED
===================================================== */

window.addEventListener(
  "beforeunload",
  () => {

    saveCoins();

    localStorage.setItem(
      "snakeColor",
      snakeColor
    );

    localStorage.setItem(
      "snakeFace",
      snakeFace
    );

    localStorage.setItem(
      "snakeFruit",
      selectedFruit
    );

  }
);

</script>
