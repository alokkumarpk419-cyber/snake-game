<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake World</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 10%,#263b65,transparent 30%),
        radial-gradient(circle at 90% 90%,#51254f,transparent 30%),
        #080b12;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:620px;
    padding:15px;
    text-align:center;
}

h1{
    color:#ffd52b;
    font-size:32px;
    margin:3px 0;
}

.subtitle{
    color:#aeb9cc;
    font-size:13px;
    margin-bottom:12px;
}

.stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:10px;
}

.stat{
    background:#171f2e;
    border:1px solid #3c4b65;
    border-radius:11px;
    padding:8px 12px;
    font-size:13px;
}

.stat b{
    color:#ffd52b;
}

.toolbar{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:12px;
}

.tool{
    border:1px solid #52627b;
    background:#202b3d;
    color:#fff;
    padding:9px 12px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.tool:active{
    transform:scale(.95);
}

.game{
    position:relative;
    width:min(92vw,500px);
    height:min(92vw,500px);
    margin:auto;
    background:#138a2e;
    border:5px solid #65ff76;
    border-radius:20px;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

.controls{
    margin:15px auto 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
}

.row{
    display:flex;
    gap:7px;
}

.control{
    width:66px;
    height:52px;
    border-radius:14px;
    background:#202a3e;
    color:#fff;
    border:2px solid #657796;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.control:active{
    transform:scale(.94);
}

/* सिर्फ DOWN BUTTON थोड़ा नीचे */
.control[data-dir="down"]{
    transform:translateY(15px);
}

.control[data-dir="down"]:active{
    transform:translateY(15px) scale(.94);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:15px;
}

.modal.show{
    display:flex;
}

.card{
    width:min(94vw,470px);
    max-height:86vh;
    overflow:auto;
    background:#111827;
    border:2px solid #ffd52b;
    border-radius:20px;
    padding:20px;
}

.card h2{
    color:#ffd52b;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.choice{
    min-height:60px;
    background:#202b40;
    color:#fff;
    border:1px solid #52627b;
    border-radius:11px;
    font-size:25px;
    cursor:pointer;
}

.choice small{
    display:block;
    font-size:9px;
    margin-top:3px;
}

.choice.selected{
    border:2px solid #ffd52b;
}

.close{
    margin-top:17px;
    border:0;
    background:#ffd52b;
    color:#111;
    padding:10px 22px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.bigGift{
    font-size:80px;
    margin:10px;
}

.rewardBox{
    background:#202b40;
    border-radius:13px;
    padding:15px;
    line-height:1.7;
}

.shopItem{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#202b40;
    padding:12px;
    border-radius:12px;
    margin:8px 0;
}

.buy{
    border:0;
    background:#ffd52b;
    color:#111;
    padding:8px 12px;
    border-radius:8px;
    font-weight:bold;
}

.danger{
    color:#ff5d5d;
}
</style>
</head>

<script>

/* ==========================================
   CANVAS
========================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const GRID = 20;


/*
   Speed जानबूझकर normal/slow रखी है.
   यह हर level पर तेज नहीं होगी.
*/

const SPEED = 180;

let tile = 20;

let snake = [];

let fruit = {
    x:10,
    y:10
};

let direction = {
    x:1,
    y:0
};

let nextDirection = {
    x:1,
    y:0
};

let score = 0;

let fruitCount = 0;

let gifts = 0;

let running = true;

let paused = false;

let lastTime = 0;

let selectedFruit = "🍎";

let selectedFace = "😈";

let tongue = false;

let soundEnabled = true;


/* ==========================================
   🪙 PERMANENT COIN SAVE
========================================== */


/*
   Game शुरू होते ही saved coins load.
*/

let coins =
Number(
    localStorage.getItem("snakeWorldCoins") || 0
);


/*
   Coins को permanent save करना.
*/

function saveCoins(){

    localStorage.setItem(
        "snakeWorldCoins",
        String(coins)
    );

}


/*
   Coins बढ़ाने का function.
*/

function addCoins(amount){

    coins += amount;

    saveCoins();

    updateUI();

}


/*
   Browser refresh/close पर save.
*/

window.addEventListener(
    "beforeunload",
    saveCoins
);


/*
   Mobile में app/tab छोड़ने पर save.
*/

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState === "hidden"
        ){

            saveCoins();

        }

    }
);


/* ==========================================
   BEST SCORE
========================================== */

let best =
Number(
    localStorage.getItem("snakeBest") || 0
);


/* ==========================================
   🔊 BUILT-IN SOUND ENGINE
========================================== */


/*
   कोई external MP3/WAV file नहीं.
   Sound browser के अंदर generate होगा.
*/

let audioContext = null;


function startAudio(){

    if(!soundEnabled)
        return;

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioCtx){

            audioContext =
                new AudioCtx();

        }

    }

    if(
        audioContext &&
        audioContext.state === "suspended"
    ){

        audioContext.resume();

    }

}


/*
   Basic tone.
*/

function tone(
    frequency,
    duration,
    type="sine",
    volume=.12,
    delay=0
){

    if(!soundEnabled)
        return;

    startAudio();

    if(!audioContext)
        return;


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
        frequency,
        audioContext.currentTime + delay
    );


    gain.gain.setValueAtTime(
        .001,
        audioContext.currentTime + delay
    );


    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioContext.currentTime +
        delay +
        .015
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
        delay +
        duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start(
        audioContext.currentTime +
        delay
    );


    oscillator.stop(
        audioContext.currentTime +
        delay +
        duration +
        .02
    );

}


/*
   🍎 FRUIT SOUND
   "टुइंग-टुइंग" जैसा दो-tone effect.
*/

function playFruitSound(){

    tone(
        880,
        .12,
        "triangle",
        .16,
        0
    );

    tone(
        1320,
        .16,
        "triangle",
        .15,
        .10
    );

}


/*
   💥 WALL/BODY SOUND
*/

function playCrashSound(){

    tone(
        120,
        .16,
        "square",
        .16,
        0
    );

    tone(
        70,
        .22,
        "square",
        .13,
        .13
    );

}


/*
   🎁 GIFT SOUND
*/

function playGiftSound(){

    tone(
        523,
        .12,
        "triangle",
        .13,
        0
    );

    tone(
        659,
        .12,
        "triangle",
        .13,
        .12
    );

    tone(
        880,
        .18,
        "triangle",
        .14,
        .24
    );

}


/*
   🪙 COIN PURCHASE SOUND
*/

function playCoinSound(){

    tone(
        700,
        .10,
        "sine",
        .12,
        0
    );

    tone(
        1000,
        .13,
        "sine",
        .12,
        .10
    );

}


/* ==========================================
   RESIZE
========================================== */

function resize(){

    const rect =
        canvas.getBoundingClientRect();

    canvas.width =
        rect.width;

    canvas.height =
        rect.height;

    tile =
        canvas.width / GRID;

    draw();

}

window.addEventListener(
    "resize",
    resize
);


/* ==========================================
   START GAME
========================================== */

function startGame(){

    snake = [

        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10},
        {x:7,y:10}

    ];


    direction = {
        x:1,
        y:0
    };


    nextDirection = {
        x:1,
        y:0
    };


    score = 0;

    fruitCount = 0;

    running = true;

    paused = false;


    /*
       IMPORTANT:
       यहाँ coins को zero नहीं किया गया.
    */

    createFruit();

    document
        .getElementById("gameOverModal")
        .classList.remove("show");

    updateUI();

}


/* ==========================================
   FRUIT
========================================== */

function createFruit(){

    let valid = false;


    while(!valid){

        fruit = {

            x:
                Math.floor(
                    Math.random() * GRID
                ),

            y:
                Math.floor(
                    Math.random() * GRID
                )

        };


        valid =
            !snake.some(
                part =>
                    part.x === fruit.x &&
                    part.y === fruit.y
            );

    }

}


/* ==========================================
   DIRECTION
========================================== */

function changeDirection(x,y){

    if(!running || paused)
        return;


    if(
        x === -direction.x &&
        y === -direction.y
    ){

        return;

    }


    nextDirection = {
        x:x,
        y:y
    };

}


/* ==========================================
   KEYBOARD
========================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowUp")
            changeDirection(0,-1);

        if(e.key === "ArrowDown")
            changeDirection(0,1);

        if(e.key === "ArrowLeft")
            changeDirection(-1,0);

        if(e.key === "ArrowRight")
            changeDirection(1,0);

    }
);


/* ==========================================
   CONTROL BUTTONS
========================================== */

document
    .querySelectorAll(".control")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    startAudio();

                    const d =
                        button.dataset.dir;

                    if(d === "up")
                        changeDirection(0,-1);

                    if(d === "down")
                        changeDirection(0,1);

                    if(d === "left")
                        changeDirection(-1,0);

                    if(d === "right")
                        changeDirection(1,0);

                }
            );

        }
    );


/* ==========================================
   TOUCH SWIPE
========================================== */

let touchStartX = 0;

let touchStartY = 0;


canvas.addEventListener(
    "touchstart",
    function(e){

        touchStartX =
            e.changedTouches[0].clientX;

        touchStartY =
            e.changedTouches[0].clientY;

    },
    {passive:true}
);


canvas.addEventListener(
    "touchend",
    function(e){

        const x =
            e.changedTouches[0].clientX;

        const y =
            e.changedTouches[0].clientY;

        const dx =
            x - touchStartX;

        const dy =
            y - touchStartY;


        if(
            Math.abs(dx) < 20 &&
            Math.abs(dy) < 20
        ){

            return;

        }


        if(
            Math.abs(dx) >
            Math.abs(dy)
        ){

            changeDirection(
                dx > 0 ? 1 : -1,
                0
            );

        }
        else{

            changeDirection(
                0,
                dy > 0 ? 1 : -1
            );

        }

    },
    {passive:true}
);


/* ==========================================
   UPDATE GAME
========================================== */

function update(){

    if(
        !running ||
        paused
    ){

        return;

    }


    direction =
        nextDirection;


    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* WALL */

    if(

        head.x < 0 ||
        head.x >= GRID ||
        head.y < 0 ||
        head.y >= GRID

    ){

        gameOver();

        return;

    }


    /* BODY */

    if(
        snake.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        )
    ){

        gameOver();

        return;

    }


    snake.unshift(head);


    /* ==================================
       🍎 FRUIT EAT
    ================================== */

    if(

        head.x === fruit.x &&
        head.y === fruit.y

    ){

        score += 10;

        fruitCount++;


        /*
           🪙 Coin immediately save.
        */

        addCoins(2);


        /*
           🔊 टुइंग-टुइंग
        */

        playFruitSound();


        createFruit();


        /*
           हर 100 fruits पर special gift.
        */

        if(
            fruitCount % 100 === 0
        ){

            gifts++;

            addCoins(50);

            showSpecialGift();

        }


        saveBest();

    }
    else{

        /*
           Fruit नहीं खाया तो tail हटेगी.
        */

        snake.pop();

    }


    updateUI();

}


/* ==========================================
   GAME OVER
========================================== */

function gameOver(){

    running = false;


    /*
       Coins हमेशा सुरक्षित.
    */

    saveCoins();


    playCrashSound();


    document.getElementById(
        "finalScore"
    ).textContent = score;


    document.getElementById(
        "finalFruits"
    ).textContent = fruitCount;


    document.getElementById(
        "finalCoins"
    ).textContent = coins;


    setTimeout(
        function(){

            document
                .getElementById(
                    "gameOverModal"
                )
                .classList.add("show");

        },
        180
    );

}


/* ==========================================
   BEST SCORE
========================================== */

function saveBest(){

    if(score > best){

        best = score;

        localStorage.setItem(
            "snakeBest",
            String(best)
        );

    }

}


/* ==========================================
   UI
========================================== */

function updateUI(){

    document.getElementById(
        "score"
    ).textContent = score;


    document.getElementById(
        "fruitCount"
    ).textContent = fruitCount;


    document.getElementById(
        "coins"
    ).textContent = coins;


    document.getElementById(
        "best"
    ).textContent = best;


    document.getElementById(
        "shopCoins"
    ).textContent = coins;

}


/* ==========================================
   DRAW
========================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Snake play area हमेशा green.
    */

    ctx.fillStyle = "#138a2e";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawFruit();


    snake.forEach(
        function(part,index){

            drawSnake(
                part,
                index
            );

        }
    );

}


/* ==========================================
   FRUIT DRAW
========================================== */

function drawFruit(){

    const x =
        fruit.x * tile +
        tile / 2;

    const y =
        fruit.y * tile +
        tile / 2;


    ctx.font =
        `${tile * .72}px Arial`;

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";


    ctx.fillText(
        selectedFruit,
        x,
        y
    );

}


/* ==========================================
   SNAKE
========================================== */

function drawSnake(
    part,
    index
){

    const x =
        part.x * tile + 1;

    const y =
        part.y * tile + 1;

    const size =
        tile - 2;


    /*
       Snake yellow.
    */

    ctx.fillStyle =
        "#ffd21c";


    roundRect(
        x,
        y,
        size,
        size,
        5
    );


    if(index === 0){

        drawHead(
            x,
            y,
            size
        );

    }

}


/* ==========================================
   ROUND RECT
========================================== */

function roundRect(
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.moveTo(
        x+r,
        y
    );

    ctx.lineTo(
        x+w-r,
        y
    );

    ctx.quadraticCurveTo(
        x+w,
        y,
        x+w,
        y+r
    );

    ctx.lineTo(
        x+w,
        y+h-r
    );

    ctx.quadraticCurveTo(
        x+w,
        y+h,
        x+w-r,
        y+h
    );

    ctx.lineTo(
        x+r,
        y+h
    );

    ctx.quadraticCurveTo(
        x,
        y+h,
        x,
        y+h-r
    );

    ctx.lineTo(
        x,
        y+r
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x+r,
        y
    );

    ctx.closePath();

    ctx.fill();

}


/* ==========================================
   SNAKE HEAD
========================================== */

function drawHead(
    x,
    y,
    size
){

    ctx.save();


    ctx.translate(
        x + size/2,
        y + size/2
    );


    let angle = 0;


    if(direction.x === -1)
        angle = Math.PI;

    if(direction.y === -1)
        angle = -Math.PI/2;

    if(direction.y === 1)
        angle = Math.PI/2;


    ctx.rotate(angle);


    ctx.translate(
        -size/2,
        -size/2
    );


    /*
       Black eyes.
    */

    ctx.fillStyle = "#000";


    ctx.beginPath();

    ctx.arc(
        size*.30,
        size*.30,
        size*.085,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        size*.70,
        size*.30,
        size*.085,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Tongue animation.
    */

    const showTongue =
        Math.floor(
            performance.now()/330
        ) % 2 === 0;


    if(showTongue){

        ctx.strokeStyle =
            "#ff3030";

        ctx.lineWidth = 2;


        ctx.beginPath();

        ctx.moveTo(
            size/2,
            size*.64
        );

        ctx.lineTo(
            size/2,
            size
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            size/2,
            size
        );

        ctx.lineTo(
            size*.40,
            size*.90
        );

        ctx.moveTo(
            size/2,
            size
        );

        ctx.lineTo(
            size*.60,
            size*.90
        );

        ctx.stroke();

    }


    ctx.restore();

}

/* ==========================================
   GAME LOOP
========================================== */

function gameLoop(time){

    if(
        running &&
        !paused &&
        time - lastTime >= SPEED
    ){

        update();

        lastTime = time;

    }


    draw();


    requestAnimationFrame(
        gameLoop
    );

}

    gameLoop
);
