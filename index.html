<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Snake World</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 15%,#243b68 0,transparent 30%),
        radial-gradient(circle at 85% 85%,#51295d 0,transparent 30%),
        #080b12;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:620px;
    padding:14px;
    text-align:center;
}

h1{
    font-size:34px;
    color:#ffd52b;
    margin:4px 0;
}

.sub{
    color:#aeb8ca;
    font-size:13px;
    margin-bottom:10px;
}

.stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:10px;
}

.stat{
    background:#171d2b;
    border:1px solid #35435c;
    padding:7px 11px;
    border-radius:10px;
    font-size:13px;
}

.stat b{
    color:#ffd52b;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
    margin-bottom:10px;
}

button{
    cursor:pointer;
    user-select:none;
}

.tool{
    background:#172033;
    color:white;
    border:1px solid #4a5b78;
    padding:9px 12px;
    border-radius:10px;
    font-weight:bold;
}

.tool:active,
.control:active{
    transform:scale(.94);
}

/* ONLY THIS AREA IS GREEN */
.game{
    position:relative;
    width:min(92vw,500px);
    height:min(92vw,500px);
    margin:auto;
    background:#138a2e;
    border:5px solid #65ff76;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 25px rgba(0,255,70,.18);
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.controls{
    margin:12px auto 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
}

.row{
    display:flex;
    gap:7px;
}

.control{
    width:66px;
    height:52px;
    border-radius:14px;
    background:#202a3e;
    color:white;
    border:2px solid #657796;
    font-size:24px;
}

.popup,
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:15px;
}

.popup.show,
.modal.show{
    display:flex;
}

.card{
    width:min(94vw,470px);
    max-height:85vh;
    overflow:auto;
    background:#111827;
    border:2px solid #ffd52b;
    border-radius:20px;
    padding:20px;
}

.card h2{
    color:#ffd52b;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.choice{
    min-height:58px;
    background:#202b40;
    border:1px solid #52627c;
    border-radius:11px;
    color:white;
    font-size:25px;
    padding:7px;
}

.choice small{
    display:block;
    font-size:10px;
    margin-top:3px;
}

.choice.selected{
    border:2px solid #ffd52b;
    background:#37445b;
}

.close{
    margin-top:16px;
    padding:9px 22px;
    border:0;
    border-radius:10px;
    background:#ffd52b;
    color:#111;
    font-weight:bold;
}

.giftIcon{
    font-size:75px;
    margin:8px;
}

.reward{
    background:#202b40;
    border-radius:12px;
    padding:15px;
    line-height:1.7;
}

@media(max-width:430px){
    h1{font-size:28px}
    .game{
        width:92vw;
        height:92vw;
    }
    .control{
        width:61px;
        height:48px;
    }
}
</style>
</head>

<body>

<div class="app">

<h1>🐍 SNAKE WORLD</h1>
<div class="sub">Eat • Grow • Collect • Unlock</div>

<div class="stats">
    <div class="stat">Score <b id="score">0</b></div>
    <div class="stat">🍎 <b id="fruitCount">0</b></div>
    <div class="stat">🪙 <b id="coins">0</b></div>

</div>

<div class="game">

<!-- Emoji control layout -->

</div>

</div>


<!-- FRUIT MENU -->

<div class="modal" id="fruitModal">

            <button class="choice" data-fruit="🍊">

            <button class="choice" data-fruit="🍇">

            </button>

            <button class="choice" data-fruit="🍌">

            <button class="choice" data-face="happy">😄<small>Happy</small></button>
            <button class="choice" data-face="cool">😎<small>Cool</small></button>

<!-- SKIN MENU -->

<div class="modal" id="skinModal">
    <div class="card">

        <h2>🐍 Snake Skin</h2>

        <div class="grid">

            <button class="choice" data-skin="yellow">🟡<small>Yellow</small></button>
            <button class="choice" data-skin="blue">🔵<small>Blue</small></button>
            <button class="choice" data-skin="red">🔴<small>Fire</small></button>
            <button class="choice" data-skin="purple">🟣<small>Magic</small></button>
            <button class="choice" data-skin="rainbow">🌈<small>Rainbow</small></button>

</div>


<!-- GIFT -->

<div class="modal" id="giftModal">
    <div class="card" style="text-align:center">

        <h2>🎁 GIFT UNLOCKED!</h2>

        <div class="giftIcon">🎁</div>

        <div class="reward" id="rewardText"></div>

        <button class="close" data-close="giftModal">
            खोलें / बंद करें
        </button>

    </div>
</div>


<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const GRID=20;

/*
 IMPORTANT:
 Speed हमेशा same रहेगी.
 Score बढ़ने पर speed नहीं बढ़ेगी.
*/

const SPEED=170;

let tile=20;

let snake=[];
let fruit={x:10,y:10};

let direction={x:1,y:0};
let nextDirection={x:1,y:0};

let score=0;
let fruitCount=0;
let coins=0;
let gifts=0;

let selectedFruit="🍎";

let selectedFace="normal";
let selectedSkin="yellow";

let running=true;
let paused=false;

let lastTime=0;

let tongue=false;
let tongueTimer=0;

let best=
    Number(localStorage.getItem("snakeBest")||0);

document.getElementById("best").textContent=best;


/* =========================
   AUDIO
========================= */

let audioContext=null;

function audioStart(){

    if(!audioContext){

        audioContext=
            new (window.AudioContext||
                 window.webkitAudioContext)();

    }

    if(audioContext.state==="suspended"){
        audioContext.resume();
    }
}

function sound(freq,duration,type="sine",volume=.11){

    audioStart();

    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();

    osc.type=type;
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
        audioContext.currentTime+duration
    );
}


/* Fruit: TUIING-TUIING */

function fruitSound(){

    sound(900,.10,"triangle",.13);

    setTimeout(
        ()=>sound(1300,.13,"triangle",.13),
        100
    );
}


/* Wall: THAK-THAK */

function wallSound(){

    sound(110,.14,"square",.14);

    setTimeout(
        ()=>sound(65,.16,"square",.13),
        130
    );
}


/* Gift: TRONG */

function giftSound(){

    sound(260,.13,"triangle",.12);

    setTimeout(
        ()=>sound(520,.16,"triangle",.12),
        110
    );

    setTimeout(
        ()=>sound(780,.18,"triangle",.12),
        230
    );
}


/* =========================
   RESIZE
========================= */

function resize(){

    const r=canvas.getBoundingClientRect();

    canvas.width=r.width;
    canvas.height=r.height;

    tile=canvas.width/GRID;

    draw();
}

window.addEventListener("resize",resize);


/* =========================
   START
========================= */

function startGame(){

    snake=[
        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10},
        {x:7,y:10}
    ];

    direction={x:1,y:0};
    nextDirection={x:1,y:0};

    score=0;
    fruitCount=0;

    running=true;
    paused=false;

    createFruit();

    document
        .getElementById("gameOver")
        .classList.remove("show");

    document
        .getElementById("pauseButton")
        .textContent="⏸️ Pause";

    updateUI();
}


/* =========================
   ONE FRUIT ONLY
========================= */

function createFruit(){

    let valid=false;

    while(!valid){

        fruit={
            x:Math.floor(Math.random()*GRID),
            y:Math.floor(Math.random()*GRID)
        };

        valid=!snake.some(
            s=>s.x===fruit.x &&
               s.y===fruit.y
        );
    }
}


/* =========================
   DIRECTION
========================= */

function changeDirection(x,y){

    if(!running||paused)return;

    if(
        x===-direction.x &&
        y===-direction.y
    )return;

    nextDirection={x,y};
}


/* Keyboard */

document.addEventListener("keydown",e=>{

    if(e.key==="ArrowUp")
        changeDirection(0,-1);

    if(e.key==="ArrowDown")
        changeDirection(0,1);

    if(e.key==="ArrowLeft")
        changeDirection(-1,0);

    if(e.key==="ArrowRight")
        changeDirection(1,0);

    if(e.key===" "||e.key.toLowerCase()==="p")
        togglePause();
});


/* Buttons */

document.querySelectorAll(".control")
.forEach(btn=>{

    btn.addEventListener("click",()=>{

        audioStart();

        const d=btn.dataset.dir;

        if(d==="up")changeDirection(0,-1);
        if(d==="down")changeDirection(0,1);
        if(d==="left")changeDirection(-1,0);
        if(d==="right")changeDirection(1,0);

    });
});


/* =========================
   SWIPE
========================= */

let sx=0,sy=0;

canvas.addEventListener("touchstart",e=>{

    sx=e.changedTouches[0].clientX;
    sy=e.changedTouches[0].clientY;

},{passive:true});


canvas.addEventListener("touchend",e=>{

    const x=e.changedTouches[0].clientX;
    const y=e.changedTouches[0].clientY;

    const dx=x-sx;
    const dy=y-sy;

    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;

    if(Math.abs(dx)>Math.abs(dy)){

        changeDirection(
            dx>0?1:-1,
            0
        );

    }else{

        changeDirection(
            0,
            dy>0?1:-1
        );

    }

},{passive:true});


/* =========================
   UPDATE
========================= */

function update(){

    if(!running||paused)return;

    direction=nextDirection;

    const head={
        x:snake[0].x+direction.x,
        y:snake[0].y+direction.y
    };


    /* WALL */

    if(
        head.x<0 ||
        head.x>=GRID ||
        head.y<0 ||
        head.y>=GRID
    ){

        gameOver();
        return;
    }


    /* BODY */

    if(
        snake.some(
            s=>s.x===head.x &&
               s.y===head.y
        )
    ){

        gameOver();
        return;
    }


    snake.unshift(head);


    /* FRUIT */

    if(
        head.x===fruit.x &&
        head.y===fruit.y
    ){

        score+=10;
        fruitCount++;
        coins+=2;

        fruitSound();

        /*
          IMPORTANT:
          Snake pop नहीं होगा,
          इसलिए Snake बड़ा होगा.
        */

        createFruit();

        if(fruitCount%100===0){

            gifts++;
            coins+=50;

            showGift();

        }

        saveBest();

    }else{

        /*
          Fruit नहीं खाया तो
          tail हटेगा.
        */

        snake.pop();
    }

    updateUI();
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;

    wallSound();

    saveBest();

    document.getElementById("finalScore")
        .textContent=score;

    document.getElementById("finalFruits")
        .textContent=fruitCount;

    setTimeout(()=>{

        document
            .getElementById("gameOver")
            .classList.add("show");

    },180);
}


/* =========================
   SAVE
========================= */

function saveBest(){

    if(score>best){

        best=score;

        localStorage.setItem(
            "snakeBest",
            best
        );
    }
}


/* =========================
   UI
========================= */

function updateUI(){

    document.getElementById("score")
        .textContent=score;

    document.getElementById("fruitCount")
        .textContent=fruitCount;

    document.getElementById("coins")
        .textContent=coins;

    document.getElementById("best")
        .textContent=best;

    document.getElementById("gifts")
        .textContent=gifts;
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );


    /* Green surface */

    ctx.fillStyle="#138a2e";

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    /* very subtle grid */

    ctx.strokeStyle="rgba(255,255,255,.035)";

    for(let i=0;i<=GRID;i++){

        ctx.beginPath();

        ctx.moveTo(i*tile,0);
        ctx.lineTo(i*tile,canvas.height);

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(0,i*tile);
        ctx.lineTo(canvas.width,i*tile);

        ctx.stroke();
    }


    /* Fruit */

    drawFruit();


    /* Snake */

    snake.forEach(
        (part,index)=>
            drawSnake(part,index)
    );
}


/* =========================
   FRUIT
========================= */

function drawFruit(){

    const x=
        fruit.x*tile+tile/2;

    const y=
        fruit.y*tile+tile/2;

    ctx.font=`${tile*.72}px Arial`;

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        selectedFruit,
        x,
        y
    );
}


/* =========================
   SNAKE COLOUR
========================= */

function snakeColor(index){

    if(selectedSkin==="yellow")
        return "#ffd21c";

    if(selectedSkin==="blue")
        return "#27b8ed";

    if(selectedSkin==="red")
        return "#ef402b";

    if(selectedSkin==="purple")
        return "#b451df";

    if(selectedSkin==="rainbow"){

        const c=[
            "#ff5252",
            "#ffca28",
            "#66bb6a",
            "#29b6f6",
            "#ab47bc"
        ];

        return c[index%c.length];
    }

    return "#ffd21c";
}


/* =========================
   SNAKE BODY
========================= */

function drawSnake(p,index){

    const x=p.x*tile+1;
    const y=p.y*tile+1;
    const s=tile-2;

    ctx.fillStyle=snakeColor(index);

    roundRect(
        x,y,s,s,5
    );

    if(index===0){

        drawHead(
            x,y,s
        );
    }
}


function roundRect(x,y,w,h,r){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.lineTo(x+w-r,y);

    ctx.quadraticCurveTo(
        x+w,y,
        x+w,y+r
    );

    ctx.lineTo(
        x+w,y+h-r
    );

    ctx.quadraticCurveTo(
        x+w,y+h,
        x+w-r,y+h
    );

    ctx.lineTo(
        x+r,y+h
    );

    ctx.quadraticCurveTo(
        x,y+h,
        x,y+h-r
    );

    ctx.lineTo(x,y+r);

    ctx.quadraticCurveTo(
        x,y,
        x+r,y
    );

    ctx.closePath();
    ctx.fill();
}


/* =========================
   HEAD
========================= */

function drawHead(x,y,s){

    ctx.save();

    /*
      Face movement direction
    */

    if(direction.x===-1){

        ctx.translate(x+s,y);
        ctx.scale(-1,1);

    }else if(direction.y===-1){

        ctx.translate(x,y+s);
        ctx.rotate(-Math.PI/2);

    }else if(direction.y===1){

        ctx.translate(x+s,y);
        ctx.rotate(Math.PI/2);

    }else{

        ctx.translate(x,y);
    }


    /* BLACK EYES */

    ctx.fillStyle="#000";

    ctx.beginPath();

    ctx.arc(
        s*.30,
        s*.32,
        s*.085,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        s*.70,
        s*.32,
        s*.085,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* FACE */

    ctx.strokeStyle="#000";

    ctx.lineWidth=
        Math.max(2,s*.055);


    if(
        selectedFace==="angry" ||
        selectedFace==="mad" ||
        selectedFace==="danger"
    ){

        line(
            s*.14,s*.18,
            s*.42,s*.29
        );

        line(
            s*.58,s*.29,
            s*.86,s*.18
        );

        line(
            s*.23,s*.67,
            s*.77,s*.67
        );

    }else if(selectedFace==="sad" ||
             selectedFace==="cry"){

        ctx.beginPath();

        ctx.arc(
            s/2,
            s*.76,
            s*.17,
            Math.PI,
            Math.PI*2
        );

        ctx.stroke();

    }else if(selectedFace==="happy" ||
             selectedFace==="laugh"){

        ctx.beginPath();

        ctx.arc(
            s/2,
            s*.54,
            s*.19,
            0,
            Math.PI
        );

        ctx.stroke();

    }else if(selectedFace==="scared"){

        ctx.beginPath();

        ctx.arc(
            s/2,
            s*.65,
            s*.11,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }else if(selectedFace==="sleep"){

        line(
            s*.20,s*.65,
            s*.43,s*.65
        );

        line(
            s*.57,s*.65,
            s*.80,s*.65
        );

    }else{

        line(
            s*.32,s*.65,
            s*.68,s*.65
        );
    }


    /* TONGUE */

    if(tongue){

        ctx.strokeStyle="#ff3030";
        ctx.lineWidth=Math.max(2,s*.05);

        line(
            s*.5,s*.66,
            s*.5,s*.98
        );

        line(
            s*.5,s*.98,
            s*.40,s
        );

        line(
            s*.5,s*.98,
            s*.60,s
        );
    }

    ctx.restore();
}


function line(x1,y1,x2,y2){

    ctx.beginPath();

    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);

    ctx.stroke();
}


/* =========================
   TONGUE
========================= */

function tongueAnimation(time){

    if(time-tongueTimer>330){

        tongue=!tongue;
        tongueTimer=time;
    }
}


/* =========================
   PAUSE
========================= */

function togglePause(){

    if(!running)return;

    paused=!paused;

    document.getElementById("pauseButton")
        .textContent=
        paused?"▶️ Resume":"⏸️ Pause";
}

document.getElementById("pauseButton")
    .onclick=()=>{

        audioStart();
        togglePause();
    };


/* =========================
   MODAL HELPERS
========================= */

function openModal(id){

    document
        .getElementById(id)
        .classList
        .add("show");
}

function closeModal(id){

    document
        .getElementById(id)
        .classList
        .remove("show");
}


document.querySelectorAll("[data-close]")
.forEach(btn=>{

    btn.onclick=()=>{

        closeModal(
            btn.dataset.close
        );
    };
});


/* =========================
   FRUIT MENU
========================= */

document.getElementById("fruitButton")
    .onclick=()=>{

        audioStart();
        openModal("fruitModal");
    };


document.querySelectorAll("[data-fruit]")
.forEach(btn=>{

    btn.onclick=()=>{

        selectedFruit=
            btn.dataset.fruit;

        createFruit();

        document
            .querySelectorAll("[data-fruit]")
            .forEach(
                b=>b.classList.remove("selected")
            );

        btn.classList.add("selected");

        closeModal("fruitModal");

        sound(700,.08);
    };
});


/* =========================
   FACE MENU
========================= */

document.getElementById("faceButton")
    .onclick=()=>{

        openModal("faceModal");
    };


document.querySelectorAll("[data-face]")
.forEach(btn=>{

    btn.onclick=()=>{

        selectedFace=
            btn.dataset.face;

        document
            .querySelectorAll("[data-face]")
            .forEach(
                b=>b.classList.remove("selected")

        btn.classList.add("selected");

/* =========================
   SKIN MENU
========================= */

document.getElementById("skinButton")
    .onclick=()=>{

/* =========================
   GIFT
========================= */

function showGift(){

    const rewards=[

        "🎭 नया Face Unlock!",
        "🐍 नया Skin Unlock!",
        "🪙 +100 Coins!",
        "🛡️ Shield Power!",
        "👑 Golden Crown!"

    ];

    const reward=
        rewards[
            Math.floor(
                Math.random()*rewards.length
            )
        ];

    document.getElementById("rewardText")
        .innerHTML=
        `<b>${reward}</b><br><br>
         100 Fruits पूरे करने पर
         यह special gift मिला!`;

    openModal("giftModal");

    giftSound();
}


/* =========================
   PLAY AGAIN
========================= */

document.getElementById("again")
    .onclick=()=>{

        audioStart();
        startGame();
    };


/* =========================
   GAME LOOP
========================= */

function loop(time){

    tongueAnimation(time);

    /*
      Fixed speed.
      कभी तेज नहीं होगी।
    */

    if(
        running &&
        !paused &&
        time-lastTime>=SPEED
    ){

        update();

        lastTime=time;
    }

    draw();

    requestAnimationFrame(loop);
}


/* =========================
   INIT
========================= */

resize();
startGame();

requestAnimationFrame(loop);

</script>
